<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <div id="app">
      <!-- Header -->
      <header class="header">
        <div class="header-left">
          <div class="logo">
            <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
            <span class="logo-text">MediaHarvest</span>
          </div>
          <span class="badge" id="status-badge">Listening</span>
        </div>
        <div class="header-right">
          <div class="counter-group">
            <div class="counter">
              <span class="counter-num" id="img-count">0</span>
              <span class="counter-label">Images</span>
            </div>
            <div class="counter">
              <span class="counter-num" id="vid-count">0</span>
              <span class="counter-label">Videos</span>
            </div>
            <div class="counter">
              <span class="counter-num" id="total-size">0 B</span>
              <span class="counter-label">Total Size</span>
            </div>
          </div>
          <button class="btn btn-ghost" id="btn-clear" title="Clear all captured media">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            Clear
          </button>
          <button class="btn btn-primary" id="btn-download-all" title="Download all filtered media">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Download All
          </button>
        </div>
      </header>

      <!-- Toolbar -->
      <div class="toolbar">
        <div class="search-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="filter-input" placeholder="Filter by URL, domain, or filename..." class="search-input" />
        </div>
        <div class="filter-tabs">
          <button class="tab active" data-filter="all">All</button>
          <button class="tab" data-filter="image">Images</button>
          <button class="tab" data-filter="video">Videos</button>
        </div>
        <div class="size-filter">
          <select id="min-size-select" class="select">
            <option value="0">Any size</option>
            <option value="10240">&gt; 10 KB</option>
            <option value="102400">&gt; 100 KB</option>
            <option value="1048576">&gt; 1 MB</option>
            <option value="10485760">&gt; 10 MB</option>
          </select>
        </div>
        <label class="auto-download">
          <input type="checkbox" id="auto-download-toggle" />
          <span>Auto-download</span>
        </label>
      </div>

      <!-- Grid -->
      <div class="grid" id="media-grid">
        <div class="empty-state" id="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="64" height="64"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
          <p class="empty-title">No media captured yet</p>
          <p class="empty-subtitle">Browse to a website and load pages — images and videos from network requests will appear here automatically.</p>
        </div>
      </div>

      <!-- Preview Modal -->
      <div class="modal-overlay" id="preview-modal">
        <div class="modal">
          <div class="modal-header">
            <span class="modal-title" id="modal-title">Preview</span>
            <button class="modal-close" id="modal-close">&times;</button>
          </div>
          <div class="modal-body" id="modal-body"></div>
          <div class="modal-footer">
            <span class="modal-url" id="modal-url"></span>
            <button class="btn btn-primary" id="modal-download">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Download
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="panel.js"></script>
  </body>
</html>
